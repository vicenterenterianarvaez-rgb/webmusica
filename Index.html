<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body>
    <h1>Mi Página de Música de Rock en Español.</h1>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"> </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Rock 80s</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Rock 90s</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Rock 2000s</a>
                    </li>

                    <form class="d-flex" role="Buscar">
                        <input class="form-control me-2" type="search" placeholder="Buscar" aria-label="Search" />
                        <button class="btn btn-outline-success" type="submit">Buscar</button>
                    </form>
            </div>
        </div>
    </nav>
    <p>
        Aquí encontrarás la mejor información de tus artistas favoritos de Rock en Español
    </p>

    <div class="container mt-4"></div>

    <div id="carouselExample" class="carousel slide">

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="img/sodastereo.png" class="d-block w-100" alt="Soda Stereo">
            </div>

            <div class="carousel-item">
                <img src="img/caifanes.png" class="d-block w-100" alt="Caifanes">
            </div>

            <div class="carousel-item">
                <img src="img/heroesdelsilencio.jpg" class="d-block w-100" alt="Heroes del Silencio">
            </div>

        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

        </button>

    </div>

    <script src="js/bootstrap.min.js"></script>

</body>

</html>
